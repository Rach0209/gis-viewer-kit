name: Deploy site to GitHub Pages

# main 에 올리면 테스트 -> 사이트 빌드 -> GitHub Pages 배포를 한다.
# 처음 한 번: 저장소 Settings > Pages > Build and deployment > Source 를 "GitHub Actions" 로 바꿔 둔다.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            viewer/package-lock.json
            gis/package-lock.json
      - run: npm ci
        working-directory: viewer
      - run: npm ci
        working-directory: gis
      - name: Tests
        run: |
          npm test
          npm test --prefix ../gis
        working-directory: viewer
      - name: Build site
        run: node scripts/build-site.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
